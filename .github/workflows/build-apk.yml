name: Build FINORA Android APK

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Create FINORA web assets
        run: |
          mkdir -p www
          if [ -s www/index.html ]; then
            echo "FINORA web app found in www."
          elif [ -s index.html ]; then
            cp index.html www/index.html
            echo "FINORA index.html copied successfully."
          else
            echo "ERROR: index.html not found."
            exit 1
          fi

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Google Social Login
        run: python3 patch-social-login.py

      - name: Copy FINORA web app into Android project
        run: npx cap sync android

      - name: Pin AndroidX Browser version
        run: |
          printf "\nconfigurations.configureEach {\n    resolutionStrategy.force 'androidx.browser:browser:1.8.0'\n}\n" >> android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
